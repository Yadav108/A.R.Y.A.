# Builds the ARYA phone app (android/) into a signed APK, downloadable from the run's "Artifacts".
# Signing key: repository secrets ARYA_KEYSTORE_B64, ARYA_KEYSTORE_PASSWORD, ARYA_KEY_ALIAS, ARYA_KEY_PASSWORD
# (one fixed key, so each new APK installs over the previous one). Without them the APK is debug-signed.
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ARYA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arya.jks"
            echo "ARYA_KEYSTORE=$RUNNER_TEMP/arya.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets: building a debug-signed APK"
          fi

      - name: Build
        working-directory: android
        env:
          ARYA_KEYSTORE_PASSWORD: ${{ secrets.ARYA_KEYSTORE_PASSWORD }}
          ARYA_KEY_ALIAS: ${{ secrets.ARYA_KEY_ALIAS }}
          ARYA_KEY_PASSWORD: ${{ secrets.ARYA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ARYA-phone-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
