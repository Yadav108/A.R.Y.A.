    include: [["1/(jωC)", "1/(j ω C)", "1/(jωc)", "-j/(ωC)", "1/(sC)", "1/(ωC)", "1 / (jωC)", "1 over j omega", "1/jωC", "−j/(ωC)"]]
  - id: inductor-impedance
