    tags: [behaviour]
    q: Who are you?
    include: [["ARYA"]]
    max_sentences: 3
  - id: formula-no-latex
    tags: [behaviour, speech]
    q: Write down the formula for the natural frequency of a mass-spring system.
    include: [["k/m", "k over m", "√(k/m)", "k / m", "sqrt(k/m)"]]
