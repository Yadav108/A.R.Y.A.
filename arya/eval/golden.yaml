# ARYA golden questions — the quality benchmark (python -m arya.eval).
#
# Each answer is checked on the text shown on screen (LaTeX already converted):
#   include:  list of groups; every group needs at least one of its alternatives
#   exclude:  none of these may appear (wrong facts, LaTeX, "I have no access")
#   max_sentences: upper bound for the whole answer (default 8)
# Matching ignores case and spaces. Entries starting with "re:" are regular expressions.
# Facts follow standard textbook results and the course material in the library.

defaults:
  max_sentences: 8
  exclude:
    - "re:\\\\(frac|sqrt|zeta|omega|\\(|\\[)"          # raw LaTeX on screen
    - "re:(don'?t|do not) have access to (your|specific)"
    - "re:can'?t access your"

questions:
  # ── Control: second-order systems ─────────────────────────────────────────
  - id: stability-2nd-order
    tags: [control, fundamentals, from-log]
    q: Tell me what are the parameters that will predict the stability of second-order system?
    include: [["ζ > 0", "zeta > 0", "ζ is greater than 0", "zeta is greater than 0", "greater than zero", "greater than 0", "ζ and ω_n are positive", "both ζ and ω_n are positive", "positive"]]
    exclude:
      - "re:ζ\\s*=\\s*0[^.]{0,40}critically"
      - "re:stab[^.]{0,60}between 0 and 1"
      - "re:stab[^.]{0,40}(positive|greater than (0|zero)) (and|but) less than (1|one)"
      - "re:ζ\\s*<\\s*0\\.5[^.]{0,30}overdamped"
      - "re:overdamped[^.]{0,30}oscillates more"
  - id: critically-damped
    tags: [control, fundamentals]
    q: What damping ratio makes a second-order system critically damped?
    include: [["ζ = 1", "zeta = 1", "ζ equals 1", "zeta equals 1", "equals one", "equal to 1", "equal to one", "of 1", "of one", "exactly 1", "is one", "is 1"]]
    exclude: ["re:ζ\\s*=\\s*0[^.]{0,30}critically", "re:0\\.5[^.]{0,30}critically"]
  - id: underdamped
    tags: [control, fundamentals]
    q: When is a second-order system underdamped?
    include: [["less than 1", "less than one", "< 1", "between 0 and 1", "0 < ζ < 1", "below 1", "below one"]]
    exclude: ["re:greater than (1|one)[^.]{0,30}underdamped"]
  - id: overdamped-oscillation
    tags: [control, fundamentals]
    q: Does an overdamped system oscillate?
    include: [["no", "does not", "doesn't", "without oscillat", "not oscillate"]]
    exclude: ["re:overdamped[^.]{0,30}oscillates more", "re:yes, (an )?overdamped"]
  - id: overshoot-formula
    tags: [control, fundamentals, from-log]
    q: What is the formula for percent overshoot of a second order system?
    include: [["e^", "exp", "e to the", "e^("], ["π", "pi"], ["√", "sqrt", "square root"]]
  - id: overshoot-0.3
    tags: [control, numbers]
    q: What is the percent overshoot for a damping ratio of 0.3?
    include: [["37"]]
    exclude: ["16.3"]
  - id: settling-time
    tags: [control, fundamentals]
    q: What is the 2 percent settling time of a second-order system?
    include: [["4"], ["ζ", "zeta"], ["ω", "omega"]]
  - id: damped-frequency
    tags: [control, fundamentals]
    q: What is the damped natural frequency of a second-order system?
    include: [["1 - ζ²", "1-ζ²", "1 − ζ²", "1 minus zeta squared", "1 - zeta^2", "1-zeta^2", "1 - zeta²"]]
  - id: first-order-63
    tags: [control, fundamentals]
    q: How long does a first-order system take to reach 63 percent of its final value?
    include: [["τ", "tau", "time constant"]]
  - id: first-order-tf
    tags: [control, fundamentals]
    q: What is the transfer function of a first-order system?
    include: [["τs + 1", "τ s + 1", "tau s + 1", "Ts + 1", "T s + 1", "τ·s + 1", "1 + τs", "1 + τ s", "1 + Ts", "1 + sT", "s + 1/τ"]]
  - id: poles-stability
    tags: [control, fundamentals]
    q: When is a linear system stable in terms of its poles?
    include: [["left half", "negative real part", "real parts are negative", "real part is negative", "real parts less than zero"]]
  - id: laplace-step
    tags: [control, fundamentals]
    q: What is the Laplace transform of a unit step?
    include: [["1/s", "1 / s", "one over s", "1 over s"]]
  - id: final-value
    tags: [control, fundamentals]
    q: What does the final value theorem say?
    include: [["lim", "limit"], ["s → 0", "s goes to 0", "s→0", "s approaches 0", "s approaches zero", "s tends to 0", "s to zero", "s goes to zero", "s → zero"]]
  - id: pid-parts
    tags: [control, fundamentals]
    q: What do the P, I and D parts of a PID controller do?
    include: [["proportional"], ["integral", "accumulat", "past error", "sum of"], ["derivative", "rate of change", "anticipat", "future"]]
  - id: pid-steady-state
    tags: [control, fundamentals]
    q: Which part of a PID controller removes steady-state error?
    include: [["integral", "I part", "I-part", "I action", "I-action", "I term"]]
    exclude: ["re:^the derivative"]
  - id: bode-bandwidth
    tags: [control, fundamentals]
    q: How is the bandwidth defined on a Bode plot?
    include: [["3 dB", "-3", "−3", "3 decibel"]]
  - id: phase-margin
    tags: [control, fundamentals]
    q: What is the phase margin?
    include: [["180"], ["crossover", "0 dB", "gain crossover", "magnitude is 1", "unity gain"]]
  - id: linearization
    tags: [control, fundamentals]
    q: What does linearization around an operating point mean?
    include: [["operating point", "equilibrium"], ["taylor", "first-order", "first order", "tangent", "derivative", "small", "approximat"]]

  # ── Dynamics ──────────────────────────────────────────────────────────────
  - id: coriolis-formula
    tags: [dynamics, fundamentals, from-log]
    q: What is the Coriolis acceleration?
    include: [["2"], ["ω", "omega", "angular velocity"], ["relative", "rotating frame", "rotating reference frame", "moving frame"]]
  - id: coriolis-zero
    tags: [dynamics, fundamentals]
    q: When is the Coriolis acceleration zero?
    include: [["parallel", "relative velocity is zero", "no relative", "zero relative", "not rotating", "ω = 0", "does not rotate", "isn't rotating", "is zero"]]
  - id: centripetal
    tags: [dynamics, fundamentals]
    q: What is the formula for centripetal acceleration?
    include: [["ω²r", "rω²", "r ω²", "ω² r", "ω²·r", "v²/r", "v² / r", "v^2/r", "omega squared"]]
  - id: newton-2
    tags: [dynamics, fundamentals]
    q: State Newton's second law.
    include: [["F = ma", "F = m a", "F = m·a", "mass times acceleration", "ma", "m·a", "m a"]]
  - id: kinetic-energy
    tags: [dynamics, fundamentals]
    q: What is the kinetic energy of a moving mass?
    include: [["½", "1/2", "one half", "half"], ["v²", "v squared", "v^2", "velocity squared"]]
  - id: rotational-energy
    tags: [dynamics, fundamentals]
    q: What is the kinetic energy of a rotating body?
    include: [["ω²", "omega squared", "ω^2"], ["moment of inertia", "J", "I", "Θ"]]
  - id: mechanical-power
    tags: [dynamics, fundamentals]
    q: What is mechanical power?
    include: [["F·v", "F · v", "F v", "force times velocity", "work per", "rate", "per unit time", "dW/dt"]]
  - id: friction-direction
    tags: [dynamics, fundamentals, from-log]
    q: Can you explain the direction of sliding friction?
    include: [["opposite", "opposes", "against"]]
  - id: friction-force
    tags: [dynamics, fundamentals]
    q: What is the formula for the sliding friction force?
    include: [["μ", "mu", "coefficient"], ["N", "normal"]]
  - id: static-vs-kinetic
    tags: [dynamics, fundamentals]
    q: Is static friction larger or smaller than kinetic friction?
    include: [["larger", "greater", "higher", "bigger", "more"]]
    exclude: ["re:static friction is (smaller|less|lower)"]
  - id: impulse
    tags: [dynamics, fundamentals]
    q: What is the impulse-momentum theorem?
    include: [["momentum"], ["impulse", "force times time", "integral of force", "F Δt", "FΔt", "∫"]]
  - id: restitution
    tags: [dynamics, fundamentals]
    q: What does a coefficient of restitution of 1 mean?
    include: [["elastic"]]
    exclude: ["re:perfectly inelastic", "re:plastic"]
  - id: rod-inertia
    tags: [dynamics, fundamentals]
    q: What is the moment of inertia of a thin rod about its centre?
    include: [["1/12", "one twelfth", "/12", "over 12", "1 / 12"]]
  - id: parallel-axis
    tags: [dynamics, fundamentals]
    q: What is the parallel axis theorem?
    include: [["md²", "m d²", "m·d²", "ma²", "m a²", "md^2", "m d squared", "mass times the distance squared", "m times d squared", "m·a²"]]
  - id: work-energy
    tags: [dynamics, fundamentals]
    q: What does the work-energy theorem say?
    include: [["kinetic energy"], ["work"]]

  # ── Your course library ───────────────────────────────────────────────────
  - id: exercise-113
