    q: in case you have a solution in chapter one, question 30.
    include: [["not", "couldn't", "can't find", "don't have", "isn't", "no exercise"]]
  - id: exercise-3-14
    tags: [library, exercises]
    q: What is exercise 3-14 about?
    include: [["cyclist", "bicycle", "bike", "cycling"]]
  - id: exercise-1-9-scan
    tags: [library, exercises, ocr]
    q: Explain exercise 1-9.
    include: [["merry-go-round", "roundabout", "platform"]]
  - id: library-overview
