<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARYA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:        #08090d;
      --surface:   #13151c;
      --surface-2: #1a1d27;
      --border:    rgba(255,255,255,0.08);
      --text:      #e9ebf1;
      --text-dim:  #838a9c;

      --idle:    #6d7cf0;
      --listen:  #f4436a;
      --think:   #f5a524;
      --speak:   #1fd18a;

      --accent: var(--idle);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(120% 90% at 50% -10%, #1b1030 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(560px, 100vw);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--idle), var(--speak));
      box-shadow: 0 0 12px 1px var(--idle);
    }

    .wake-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--speak);
      font-weight: 600;
      opacity: 0.85;
    }
    .wake-indicator::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--speak);
      box-shadow: 0 0 8px 1px var(--speak);
      animation: breathe 2s ease-in-out infinite;
    }

    /* ── Chat transcript ────────────────────────────────────────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 4px 20px;
      scrollbar-width: thin;
      scrollbar-color: #2a2e3a transparent;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 3px; }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.92rem;
      max-width: 260px;
      line-height: 1.5;
    }

    .msg {
      max-width: 82%;
      display: flex;
      animation: rise 0.25s ease both;
    }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.94rem;
      line-height: 1.48;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #5b63e6, #7c3aed);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Control panel ──────────────────────────────────────────────────── */
    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
    }

    .orb-stage {
      position: relative;
      width: 148px;
      height: 148px;
      display: grid;
      place-items: center;
      --amp: 0;
    }

    .progress-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
    .progress-ring__bg, .progress-ring__fg {
      fill: none;
      stroke-width: 3;
    }
    .progress-ring__bg { stroke: rgba(255,255,255,0.06); }
    .progress-ring__fg {
      stroke: var(--listen);
      stroke-linecap: round;
      stroke-dasharray: 452.39;
      stroke-dashoffset: 452.39;
      opacity: 0;
      transition: stroke-dashoffset 0.1s linear, opacity 0.2s ease;
    }

    .thinking-ring {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, var(--think) 55%, transparent 75%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      opacity: 0;
      transition: opacity 0.2s ease;
      animation: spin 1.1s linear infinite;
    }

    .orb {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 32% 28%, #2a2f42, #14161d 70%);
      box-shadow:
        0 0 0 1px var(--border),
        0 0 30px 2px color-mix(in srgb, var(--accent) 35%, transparent),
        inset 0 0 20px rgba(0,0,0,0.4);
      transition: box-shadow 0.35s ease, background 0.35s ease;
      animation: breathe 4.5s ease-in-out infinite;
    }
    .orb:disabled { cursor: not-allowed; }

    .orb-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
      opacity: calc(0.45 + var(--amp) * 0.5);
      filter: blur(calc(7px + var(--amp) * 12px));
      transform: scale(calc(1 + var(--amp) * 0.16));
      transition: background 0.35s ease, opacity 0.08s linear, filter 0.08s linear, transform 0.08s linear;
      animation: blobMorphGlow 9s ease-in-out infinite;
    }

    /* The core is the "alive" part — a glossy, softly wobbling sphere whose
       size reacts in real time to actual audio amplitude (mic input while
       listening, TTS output while speaking), driven by --amp from JS. */
    .orb-core {
      position: absolute;
      width: 56%;
      height: 56%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,0.85) 0%, transparent 24%),
        radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--accent) 90%, white 15%) 0%, var(--accent) 55%, color-mix(in srgb, var(--accent) 55%, black) 100%);
      box-shadow:
        0 0 22px 4px color-mix(in srgb, var(--accent) 55%, transparent),
        inset -6px -8px 14px rgba(0,0,0,0.35),
        inset 4px 6px 10px rgba(255,255,255,0.16);
      transform: scale(calc(1 + var(--amp) * 0.22));
      transition: background 0.35s ease, box-shadow 0.35s ease, transform 0.06s linear;
      animation: blobMorphCore 7s ease-in-out infinite;
    }

    .orb-core::after {
      content: "";
      position: absolute;
      top: 14%;
      left: 20%;
      width: 34%;
      height: 24%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 70%);
      filter: blur(1px);
      animation: glint 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes blobMorphCore {
      0%, 100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
      25%      { border-radius: 58% 42% 54% 46% / 46% 54% 42% 58%; }
      50%      { border-radius: 44% 56% 48% 52% / 56% 44% 58% 42%; }
      75%      { border-radius: 52% 48% 42% 58% / 48% 52% 55% 45%; }
    }
    @keyframes blobMorphGlow {
      0%, 100% { border-radius: 50%; }
      33%      { border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; }
      66%      { border-radius: 54% 46% 48% 52% / 48% 54% 46% 52%; }
    }
    @keyframes glint {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.75; }
      50%      { transform: translate(10%, 6%) scale(0.85); opacity: 0.45; }
    }

    .orb-icon {
      position: relative;
      font-size: 1.3rem;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
    }

    .orb-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 600;
      min-height: 1.2em;
      text-align: center;
    }

    .status {
      font-size: 0.82rem;
      font-weight: 600;
      min-height: 1.3em;
      text-align: center;
      color: var(--text-dim);
      transition: color 0.25s ease;
    }
    .status.listening { color: var(--listen); }
    .status.thinking  { color: var(--think); }
    .status.speaking  { color: var(--speak); }

    /* ── State: listening ──────────────────────────────────────────────── */
    .orb-stage.listening { --accent: var(--listen); }
    .orb-stage.listening .orb {
      animation: listenPulse 1.4s ease-out infinite, breathe 4.5s ease-in-out infinite;
    }
    .orb-stage.listening .progress-ring__fg { opacity: 1; }

    @keyframes listenPulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--listen) 45%, transparent), 0 0 0 1px var(--border); }
      70%  { box-shadow: 0 0 0 22px color-mix(in srgb, var(--listen) 0%, transparent), 0 0 0 1px var(--border); }
      100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--listen) 0%, transparent), 0 0 0 1px var(--border); }
    }

    /* ── State: thinking ───────────────────────────────────────────────── */
    .orb-stage.thinking { --accent: var(--think); }
    .orb-stage.thinking .thinking-ring { opacity: 1; }
    .orb-stage.thinking .orb { animation: breathe 1.4s ease-in-out infinite; }

    /* ── State: speaking ───────────────────────────────────────────────── */
    /* No mechanical bounce keyframe here on purpose — the core's scale is
       driven live by --amp (real TTS output amplitude, see ampTick() in the
       script), so the outer shell just keeps a calm ambient breathe while
       the inner core does the actual "talking". */
    .orb-stage.speaking { --accent: var(--speak); }
    .orb-stage.speaking .orb { animation: breathe 2.4s ease-in-out infinite; }

    /* ── State: disabled/idle (disconnected) ───────────────────────────── */
    .orb-stage.offline .orb { opacity: 0.4; animation: none; }
    .orb-stage.offline .orb-glow { opacity: 0.15; }
    .orb-stage.offline .orb-core { animation: none; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.045); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-dot"></span>ARYA</div>
      <span id="wakeIndicator" class="wake-indicator">always listening</span>
    </header>

    <div id="chat" class="chat">
      <div id="chatEmpty" class="chat-empty">Tap the orb and say something — ARYA is listening.</div>
    </div>

    <div class="control-panel">
      <div id="orbStage" class="orb-stage offline">
        <svg class="progress-ring" viewBox="0 0 148 148">
          <circle class="progress-ring__bg" cx="74" cy="74" r="72" />
          <circle id="progressCircle" class="progress-ring__fg" cx="74" cy="74" r="72" />
        </svg>
        <div class="thinking-ring"></div>
        <button id="talkButton" class="orb" type="button" disabled aria-label="Tap to talk">
          <span class="orb-glow"></span>
          <span class="orb-core"></span>
          <span class="orb-icon" id="orbIcon">🎤</span>
        </button>
      </div>
      <div id="orbLabel" class="orb-label">Tap to talk</div>
      <div id="status" class="status">Connecting...</div>
    </div>
  </div>

  <script>
    const statusEl    = document.getElementById("status");
    const talkButton  = document.getElementById("talkButton");
    const orbStage    = document.getElementById("orbStage");
    const orbIcon     = document.getElementById("orbIcon");
    const orbLabel    = document.getElementById("orbLabel");
    const chatEl      = document.getElementById("chat");
    const chatEmpty   = document.getElementById("chatEmpty");
    const progressCircle = document.getElementById("progressCircle");

    const RING_CIRCUMFERENCE = 452.39;

    /* ── State ─────────────────────────────────────────────────────────── */
    let socket         = null;
    let reconnectTimer = null;
    let mediaRecorder  = null;
    let micStream      = null;
    let audioChunks    = [];
    let isRecording    = false;
    let isBusy         = false;

    const audioQueue = [];
    let isPlaying    = false;
    let currentAudio = null;
    let audioUnlocked = false;
    let currentAssistantEl = null;
    // Server-side playback (AUDIO_OUTPUT=local): ARYA speaks through the PC
    // speakers, the page just mirrors state.
    let remoteSpeaking = false;
    let followupTimer  = null;

    /* ── Autoplay unlock ────────────────────────────────────────────────
       Chrome blocks unmuted Audio.play() until the page has seen a user
       gesture. The wake word can trigger a response before the user has
       ever clicked anything, so TTS audio silently fails to play. Unlock
       on the very first interaction anywhere on the page. */
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      const silent = new Audio(
        "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
      );
      silent.play().catch(() => {});
      ensureAudioCtx();
    }
    ["click", "touchstart", "keydown"].forEach((evt) =>
      document.addEventListener(evt, unlockAudio, { once: true })
    );

    /* ── Live amplitude → orb reactivity ──────────────────────────────────
       The orb's inner core scales in real time off actual audio energy:
       mic input while listening, TTS output while speaking. Falls back to a
       gentle synthetic wobble if Web Audio is unavailable so the orb still
       reads as "alive" rather than frozen. */
    let audioCtx        = null;
    let listenAnalyser   = null;
    let listenSource     = null;
    let speakAnalyser    = null;
    let currentAmp       = 0;

    function ensureAudioCtx() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      } catch (err) {
        audioCtx = null;
      }
      return audioCtx;
    }

    function startListenAnalyser() {
      const ctx = ensureAudioCtx();
      if (!ctx || !micStream) return;
      try {
        listenSource = ctx.createMediaStreamSource(micStream);
        listenAnalyser = ctx.createAnalyser();
        listenAnalyser.fftSize = 256;
        listenSource.connect(listenAnalyser);
      } catch (err) {
        listenAnalyser = null;
      }
    }

    function stopListenAnalyser() {
      if (listenSource) { try { listenSource.disconnect(); } catch (err) {} }
      listenSource = null;
      listenAnalyser = null;
    }

    function attachSpeakAnalyser(audioEl) {
      const ctx = ensureAudioCtx();
      if (!ctx) return;
      try {
        if (!speakAnalyser) {
          speakAnalyser = ctx.createAnalyser();
          speakAnalyser.fftSize = 256;
          speakAnalyser.connect(ctx.destination);
        }
        ctx.createMediaElementSource(audioEl).connect(speakAnalyser);
      } catch (err) {
        // Playback still works untouched — just no amplitude reactivity.
      }
    }

    function readRMS(analyser) {
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sumSquares = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sumSquares += v * v;
      }
      return Math.sqrt(sumSquares / data.length);
    }

    function ampTick(t) {
      let target = 0;
      if (isRecording && listenAnalyser) {
        target = Math.min(1, readRMS(listenAnalyser) * 4.5);
      } else if (isPlaying && speakAnalyser) {
        target = Math.min(1, readRMS(speakAnalyser) * 4.5);
      } else if (isRecording || isPlaying || remoteSpeaking) {
        // No analyser available (unsupported browser, permission edge case) —
        // synthetic wobble so the orb still feels responsive, not dead.
        target = Math.max(0, 0.35 + 0.25 * Math.sin(t / 140) + 0.15 * Math.sin(t / 55 + 1.3));
      }
      const attack = target > currentAmp ? 0.5 : 0.15; // fast rise, slower fall — like a VU meter
      currentAmp += (target - currentAmp) * attack;
      orbStage.style.setProperty("--amp", currentAmp.toFixed(3));
      requestAnimationFrame(ampTick);
    }
    requestAnimationFrame(ampTick);

    /* ── Chat transcript helpers ───────────────────────────────────────── */
    function createBubble(role, text) {
      if (chatEmpty) chatEmpty.remove();
      const row = document.createElement("div");
      row.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollChatToBottom();
      return bubble;
    }

    function scrollChatToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendUserMessage(text) {
      currentAssistantEl = null;
      createBubble("user", text);
    }

    function appendAssistantChunk(text) {
      if (!currentAssistantEl) currentAssistantEl = createBubble("assistant", "");
      currentAssistantEl.textContent += text;
      scrollChatToBottom();
    }

    /* ── Orb / status ──────────────────────────────────────────────────── */
    const STATE_ICON = { idle: "🎤", listening: "🔴", thinking: "…", speaking: "🔊" };

    function setOrbState(state) {
      orbStage.classList.remove("listening", "thinking", "speaking", "offline");
      if (state !== "idle") orbStage.classList.add(state);
      orbIcon.textContent = STATE_ICON[state] || "🎤";
    }

    function setStatus(text, cls = "") {
      statusEl.textContent = text;
      statusEl.className   = "status " + cls;
      setOrbState(cls || "idle");
    }

    function setBusy(busy) {
      isBusy = busy;
      talkButton.disabled = busy;
    }

    /* ── Audio playback queue ───────────────────────────────────────────── */
    async function playNext() {
      if (isPlaying || audioQueue.length === 0) return;
      isPlaying = true;
      const blob = audioQueue.shift();
      const url  = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      attachSpeakAnalyser(currentAudio);

      currentAudio.onplay  = () => setStatus("Speaking...", "speaking");
      currentAudio.onended = () => {
        isPlaying = false;
        URL.revokeObjectURL(url);
        currentAudio = null;
        if (audioQueue.length === 0) { setBusy(false); setStatus("Ready"); }
        playNext();
      };
      currentAudio.onerror = () => {
        isPlaying = false;
        URL.revokeObjectURL(url);
        currentAudio = null;
        if (audioQueue.length === 0) { setBusy(false); setStatus("Ready"); }
        playNext();
      };
      try { await currentAudio.play(); }
      catch (err) {
        console.error("Audio playback blocked:", err);
        isPlaying = false; currentAudio = null;
        if (audioQueue.length === 0) {
          setBusy(false);
          setStatus(err.name === "NotAllowedError" ? "Voice blocked — tap the orb once to enable audio" : "Ready");
        }
        playNext();
      }
    }

    /* ── WebSocket ──────────────────────────────────────────────────────── */
    function connectWebSocket() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      // Token: injected by the server for this machine, or passed as #token=... in the URL.
      const token = window.ARYA_TOKEN || new URLSearchParams(location.hash.slice(1)).get("token") || "";
      socket = new WebSocket(`${wsProto}://${location.host || "localhost:8000"}/ws?token=${encodeURIComponent(token)}`);
      socket.binaryType = "arraybuffer";

      socket.onopen = () => {
        if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
        setStatus("Ready");
        talkButton.disabled = false;
        document.getElementById("wakeIndicator").style.display = "inline-flex";
      };

      socket.onmessage = async (event) => {
        /* ── binary → TTS audio ── */
        if (event.data instanceof ArrayBuffer) {
          // Local Piper voice sends WAV ("RIFF" header); the online voice sends MP3.
          const head = new Uint8Array(event.data, 0, Math.min(4, event.data.byteLength));
          const isWav = head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46;
          const blob = new Blob([event.data], { type: isWav ? "audio/wav" : "audio/mpeg" });
          audioQueue.push(blob);
          await playNext();
          return;
        }

        /* ── text messages ── */
        const msg = event.data;

        if (msg === "ARYA_SPEAKING") {
          remoteSpeaking = true;
          setStatus("Speaking...", "speaking");
          return;
        }

        if (msg === "ARYA_FOLLOWUP" || msg.startsWith("ARYA_FOLLOWUP:")) {
          // Hands-free conversation: ARYA is listening for a reply without the wake word,
          // for as many seconds as the server says the conversation stays open.
          const secs = parseInt(msg.split(":")[1], 10) || 12;
          setStatus("In conversation — just talk, no wake word needed", "listening");
          clearTimeout(followupTimer);
          followupTimer = setTimeout(() => {
            if (statusEl.textContent.startsWith("In conversation")) setStatus("Ready — say \"Hey ARYA\"");
          }, secs * 1000);
          return;
        }

        if (msg.startsWith("NOTIFY:")) {
          currentAssistantEl = null;
          appendAssistantChunk("⏰ " + msg.slice("NOTIFY:".length));
          currentAssistantEl = null;
          return;
        }

        if (msg === "ARYA_INTERRUPT") {
          remoteSpeaking = false;
          // Server is barging in with a new response — stop whatever is playing.
          audioQueue.length = 0;
          if (currentAudio) {
            currentAudio.pause();
            currentAudio.onplay = currentAudio.onended = currentAudio.onerror = null;
            currentAudio = null;
          }
          isPlaying = false;
          setStatus("Interrupted...", "thinking");
          return;
        }

        if (msg === "ARYA_DONE") {
          remoteSpeaking = false;
          // If no audio arrived, unblock now
          if (audioQueue.length === 0 && !isPlaying) { setBusy(false); setStatus("Ready"); }
          return;
        }

        if (msg === "ARYA_NO_SPEECH") {
          setBusy(false);
          setStatus("No speech detected — try again");
          setTimeout(() => { if (statusEl.textContent.startsWith("No speech")) setStatus("Ready"); }, 3000);
          return;
        }

        if (msg === "ARYA_WAKE") {
          // Wake word triggered from server side
          setBusy(true);
          talkButton.disabled = true;
          setStatus("Wake word detected...", "listening");
          return;
        }

        if (msg.startsWith("TRANSCRIPT:")) {
          clearTimeout(followupTimer);
          const transcript = msg.slice("TRANSCRIPT:".length);
          appendUserMessage(transcript);
          setStatus("Thinking...", "thinking");
          return;
        }

        // Regular response text chunk
        appendAssistantChunk(msg);
        if (!isPlaying) setStatus("Thinking...", "thinking");
      };

      socket.onerror = () => setStatus("Connection error");
      socket.onclose = () => {
        setStatus(token ? "Disconnected — reconnecting..."
                        : "Not authorised — open http://localhost:8000 on the ARYA computer");
        orbStage.classList.add("offline");
        talkButton.disabled = true;
        if (!reconnectTimer) reconnectTimer = setInterval(connectWebSocket, 3000);
      };
    }

    connectWebSocket();

    const MIN_REC_MS  = 2000;   // never cut off before 2 s
    const MAX_REC_MS  = 15000;  // auto-stop at 15 s

    let recStartTime  = 0;
    let recTimerID    = null;
    let autoStopID    = null;

    /* ── Microphone setup ───────────────────────────────────────────────── */
    async function ensureMic() {
      if (micStream && micStream.active) return true;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false,
        });
        return true;
      } catch (err) {
        const msg = err.name === "NotAllowedError"
          ? "Microphone blocked — allow access in browser settings"
          : "No microphone found";
        setStatus(msg);
        setTimeout(() => { if (statusEl.textContent === msg) setStatus("Ready"); }, 4000);
        return false;
      }
    }

    /* ── Progress ring animation while recording ─────────────────────────── */
    function startRing() {
      recStartTime = Date.now();
      progressCircle.style.transition = "none";
      progressCircle.style.strokeDashoffset = RING_CIRCUMFERENCE;
      recTimerID = setInterval(() => {
        const pct = Math.min(1, (Date.now() - recStartTime) / MAX_REC_MS);
        progressCircle.style.transition = "stroke-dashoffset 0.1s linear";
        progressCircle.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - pct);
      }, 100);
    }

    function stopRing() {
      clearInterval(recTimerID);
      progressCircle.style.transition = "stroke-dashoffset 0.3s ease, opacity 0.2s ease";
      progressCircle.style.strokeDashoffset = RING_CIRCUMFERENCE;
    }

    /* ── Recording ──────────────────────────────────────────────────────── */
    async function startRecording() {
      if (isRecording || isBusy) return;
      if (!(await ensureMic())) return;
      if (!socket || socket.readyState !== WebSocket.OPEN) { setStatus("Not connected"); return; }

      audioChunks = [];
      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus" : "";
      mediaRecorder = mimeType
        ? new MediaRecorder(micStream, { mimeType })
        : new MediaRecorder(micStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        isRecording = false;
        clearTimeout(autoStopID);
        stopRing();
        stopListenAnalyser();
        orbLabel.textContent = "Tap to talk";
        orbStage.classList.remove("listening");

        if (audioChunks.length === 0) { setStatus("Ready"); return; }
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        if (blob.size < 1500) { setStatus("Too short — tap again and speak"); setTimeout(() => setStatus("Ready"), 3000); return; }

        setBusy(true);
        setStatus("Transcribing...", "thinking");
        const buf = await blob.arrayBuffer();
        socket.send(buf);
      };

      mediaRecorder.start();
      isRecording = true;
      recStartTime = Date.now();
      startRing();
      startListenAnalyser();
      orbLabel.textContent = "Tap to stop";
      setStatus("Listening...", "listening");

      // auto-stop at MAX_REC_MS
      autoStopID = setTimeout(doStop, MAX_REC_MS);
    }

    function doStop() {
      if (!isRecording || !mediaRecorder) return;
      const elapsed = Date.now() - recStartTime;
      if (elapsed < MIN_REC_MS) {
        // too soon — wait out the minimum duration then stop
        setTimeout(doStop, MIN_REC_MS - elapsed);
        return;
      }
      mediaRecorder.stop();
    }

    /* ── Button: single click toggles start / stop ──────────────────────── */
    talkButton.addEventListener("click", () => {
      if (isBusy) return;
      if (isRecording) doStop();
      else startRecording();
    });

    talkButton.addEventListener("touchend", (e) => {
      e.preventDefault();
      talkButton.click();
    }, { passive: false });
  </script>
</body>
</html>
