<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<title>ARYA</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262a33; --text:#e8e8ea; --muted:#9aa0aa; --me:#2b5cff;
          --accent:#7aa2ff; --warn:#ffcf6e; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  #dot.ok { background:#3ecf8e; } #dot.bad { background:#ff6b6b; }
  #state { color:var(--muted); font-size:13px; margin-left:auto; }
  #nudge { display:none; margin:10px 16px 0; padding:10px 12px; border-radius:10px; background:#2a2312;
           color:var(--warn); border:1px solid #4a3d18; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .arya { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .note { align-self:center; color:var(--warn); font-size:14px; text-align:center; }
  .sys { align-self:center; color:var(--muted); font-size:13px; text-align:center; }
  #chips, #yesno { display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; }
  #yesno { display:none; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--text);
           border-radius:999px; padding:7px 13px; white-space:nowrap; }
  button.primary { background:var(--me); border-color:var(--me); color:#fff; }
  form { display:flex; gap:8px; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
         border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; color:var(--text); background:var(--panel);
             border:1px solid var(--line); border-radius:12px; padding:9px 12px; max-height:120px; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  #unpaired { display:none; padding:40px 24px; text-align:center; color:var(--muted); }
  #cam, #clip, #mic { padding:7px 10px; flex:none; }
  #modes { display:flex; gap:6px; padding:8px 16px 0; }
  #modes button { flex:1; padding:6px 0; font-size:14px; }
  #modes button[aria-pressed="true"] { background:var(--me); border-color:var(--me); color:#fff; }
</style>
</head>
<body>
<header><span id="dot"></span><h1>ARYA</h1><span id="state">connecting…</span></header>
<div id="unpaired">This phone isn't paired.<br><br>At the laptop, say <b>“connect my phone”</b> and scan the QR code.</div>
<div id="modes" role="group" aria-label="Mode">
  <button data-mode="default" aria-pressed="true">Normal</button>
  <button data-mode="study" aria-pressed="false">Study</button>
  <button data-mode="work" aria-pressed="false">Work</button>
  <button data-mode="brainstorm" aria-pressed="false">Ideas</button>
</div>
<div id="nudge" role="status"></div>
<div id="log" aria-live="polite"></div>
<div id="yesno"><button class="primary" data-say="yes">Yes</button><button data-say="no">No</button></div>
<div id="chips">
  <button data-say="What's next today?">What's next?</button>
  <button data-say="Give me the briefing">Briefing</button>
  <button data-say="How many cards are due?">Cards due</button>
  <button data-say="Remind me in 30 minutes to take a break">Break in 30 min</button>
  <button data-say="Pause the music">Pause music</button>
</div>
<form id="f" autocomplete="off">
  <button type="button" id="cam" aria-label="Take a photo" title="Take a photo">📷</button>
  <button type="button" id="clip" aria-label="Send a file" title="Send a document, photo, audio or video">📎</button>
  <button type="button" id="mic" aria-label="Record a voice note" title="Record a voice note (your phone's recorder)">🎙</button>
  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="micIn" accept="audio/*" capture hidden>
  <input type="file" id="fileIn" hidden accept=".pdf,.docx,.pptx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif,.bmp,.mp3,.m4a,.wav,.ogg,.flac,.aac,.mp4,.mkv,.webm,.mov,.avi,.wmv,image/*,audio/*,video/*">
  <textarea id="t" rows="1" maxlength="1000" placeholder="Ask ARYA…" enterkeyhint="send"></textarea>
  <button class="primary" id="send" type="submit">Send</button>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log");
let last = 0, busy = false, paired = false;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function state(text, ok) {
  $("state").textContent = text;
  $("dot").className = ok === true ? "ok" : ok === false ? "bad" : "";
}
async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json", "X-ARYA": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { status: r.status, data };
}
function showMode(m) {
  if (!m) return;
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
}
function showUnpaired() {
  paired = false;
  $("unpaired").style.display = "block";
  ["log", "chips", "f", "yesno", "modes"].forEach((id) => { $(id).style.display = "none"; });
  state("not paired", false);
}
// From the laptop: "send this to my phone" (text, maybe a link) and "ring my phone" (find my phone).
function fromLaptop(item) {
  const d = add("arya", "💻 " + item.text);
  if (item.url && /^https?:\/\//i.test(item.url)) {
    d.textContent = "💻 ";
    const a = document.createElement("a");
    a.href = item.url; a.textContent = item.text === item.url ? item.url : item.text;
    a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.color = "var(--accent)";
    d.appendChild(a);
  }
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
let ringing = null;
function ring(item) {
  stopRing();
  const n = $("nudge");
  n.innerHTML = "";
  n.appendChild(document.createTextNode("🔔 ARYA is ringing your phone "));
  const b = document.createElement("button"); b.textContent = "Found it"; b.className = "primary";
  b.addEventListener("click", stopRing); n.appendChild(b);
  n.style.display = "block";
  let ctx = null;
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const beep = () => {
    if (navigator.vibrate) { try { navigator.vibrate([400, 150, 400]); } catch (e) {} }
    if (!ctx) return;
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = i === 2 ? 1400 : 1000; g.gain.value = 0.6;
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18);
    });
  };
  beep();
  const timer = setInterval(beep, 1500);
  ringing = { timer, ctx, until: setTimeout(stopRing, 30000) };
}
function stopRing() {
  if (!ringing) return;
  clearInterval(ringing.timer); clearTimeout(ringing.until);
  try { ringing.ctx && ringing.ctx.close(); } catch (e) {}
  ringing = null;
  $("nudge").style.display = "none";
}
function onItem(item) {
  if (item.kind === "ring") ring(item);
  else if (item.kind === "message") fromLaptop(item);
  else nudge(item);
}

function nudge(item) {
  const n = $("nudge");
  n.textContent = item.at + " — " + item.text;
  n.style.display = "block";
  add("note", "🔔 " + item.at + " · " + item.text);
  if (navigator.vibrate) { try { navigator.vibrate([150, 80, 150]); } catch (e) {} }
  clearTimeout(nudge.t);
  nudge.t = setTimeout(() => { n.style.display = "none"; }, 15000);
}

async function pairFromLink() {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (!m) return;
  history.replaceState(null, "", location.pathname);       // the key leaves the address bar right away
  const r = await api("/api/pair", { key: decodeURIComponent(m[1]) });
  if (r.status !== 200) add("sys", r.data.error || "Pairing failed.");
}

async function hello() {
  try {
    const r = await api("/api/hello");
    if (r.status === 401) return showUnpaired();
    paired = true;
    last = r.data.last || 0;
    showMode(r.data.mode);
    state("connected", true);
    (r.data.recent || []).filter((it) => it.kind !== "ring")       // an old ring doesn't ring again
      .forEach((it) => it.kind === "message" ? fromLaptop(it) : add("note", "🔔 " + it.at + " · " + it.text));
  } catch (e) {
    state("laptop not reachable", false);
  }
}

async function poll() {
  // Also while in the background (the browser slows this down), so "ring my phone" can reach an open page.
  if (!paired) return;
  try {
    const r = await api("/api/feed?after=" + last);
    if (r.status === 401) return showUnpaired();
    state("connected", true);
    showMode(r.data.mode);
    for (const it of r.data.items || []) { last = Math.max(last, it.id); onItem(it); }
  } catch (e) {
    state("laptop not reachable", false);
  }
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  $("send").disabled = true;
  $("yesno").style.display = "none";
  add("me", text);
  const thinking = add("arya", "…");
  try {
    const r = await api("/api/say", { text });
    if (r.status === 401) { thinking.remove(); return showUnpaired(); }
    thinking.textContent = r.data.reply || r.data.error || "Something went wrong.";
    if (r.data.confirm) $("yesno").style.display = "flex";
    state("connected", true);
  } catch (e) {
    thinking.textContent = "I can't reach the laptop. Is it awake and on the same Wi-Fi?";
    state("laptop not reachable", false);
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); const t = $("t"); send(t.value); t.value = ""; t.style.height = ""; });
$("t").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
$("t").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = e.target.scrollHeight + "px"; });
document.querySelectorAll("[data-say]").forEach((b) => b.addEventListener("click", () => send(b.dataset.say)));
// ── Sending a photo or file TO ARYA (the phone never reads the laptop's files) ──
const KINDS = {
  document: [".pdf", ".docx", ".pptx", ".txt", ".md"],
  photo: [".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"],
  recording: [".mp3", ".m4a", ".wav", ".ogg", ".flac", ".aac", ".mp4", ".mkv", ".webm", ".mov", ".avi", ".wmv"],
};
const MAX_MB = { document: 50, photo: 15, recording: 400 };
function kindOf(name) {
  const ext = (name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  return Object.keys(KINDS).find((k) => KINDS[k].includes(ext)) || null;
}
function upload(file, asNote) {
  if (!file || busy) return;
  let name = file.name || (asNote ? "voice note.m4a" : "photo.jpg");
  if (asNote && !/\.[^.]+$/.test(name)) name += ".m4a";
  if (!/\.[^.]+$/.test(name) && file.type.startsWith("image/")) name += ".jpg";
  const kind = kindOf(name);
  if (!kind) { add("sys", "I can take PDFs, Word, PowerPoint, text, photos, audio and video."); return; }
  if (file.size > MAX_MB[kind] * 1024 * 1024) { add("sys", `That file is larger than ${MAX_MB[kind]} MB.`); return; }
  const note = add("me", (asNote ? "🎙 " : kind === "photo" ? "📷 " : "📎 ") + name);
  const status = add("sys", "Sending…");
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?name=" + encodeURIComponent(name) + (asNote ? "&note=1" : ""));
  xhr.setRequestHeader("X-ARYA", "1");
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) status.textContent = `Sending… ${Math.round(100 * e.loaded / e.total)}%`; };
  xhr.onload = () => {
    let info = {};
    try { info = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 401) { status.remove(); note.remove(); return showUnpaired(); }
    if (xhr.status !== 200) { status.textContent = info.error || "Couldn't read that file."; return; }
    status.remove();
    if (info.kind === "photo") send(info.chars >= 80 ? "Explain the photo I just added." : "What's in the photo I just added?");
    else if (info.kind === "document") send("Summarize the document I just added.");
    else if (info.kind === "recording" && info.note) add("sys", "Transcribing your voice note; I'll file it and tell you where.");
    else if (info.kind === "recording") add("sys", `Transcribing ${info.title} (${info.minutes} min). I'll tell you here when it's ready.`);
  };
  xhr.onerror = () => { status.textContent = "I can't reach the laptop. Is it awake and on the same Wi-Fi?"; };
  xhr.send(file);
}
$("cam").addEventListener("click", () => $("camIn").click());
$("clip").addEventListener("click", () => $("fileIn").click());
$("camIn").addEventListener("change", (e) => { upload(e.target.files[0]); e.target.value = ""; });
$("mic").addEventListener("click", () => $("micIn").click());
$("micIn").addEventListener("change", (e) => { upload(e.target.files[0], true); e.target.value = ""; });
$("fileIn").addEventListener("change", (e) => { upload(e.target.files[0]); e.target.value = ""; });

document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", async () => {
  try {
    const r = await api("/api/mode", { mode: b.dataset.mode });
    if (r.status === 401) return showUnpaired();
    if (r.status === 200) showMode(r.data.mode);
  } catch (e) { state("laptop not reachable", false); }
}));
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

(async () => {
  await pairFromLink();
  await hello();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
